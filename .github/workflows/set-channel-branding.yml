name: Set Channel Branding

on:
  workflow_dispatch: {}

jobs:
  set-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set channel title, description, and avatar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF2'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          base = f"https://api.telegram.org/bot{token}"

          # 1. Rename channel
          resp = requests.post(f"{base}/setChatTitle", data={
              "chat_id": chat_id,
              "title": "Глаголичні новини",
          }, timeout=20)
          print("setChatTitle:", resp.status_code, resp.text)

          # 2. Set description with alphabet legend
          legend_pairs = {
              "А": 0x2C00, "Б": 0x2C01, "В": 0x2C02, "Г": 0x2C03, "Ґ": 0x2C0C,
              "Д": 0x2C04, "Е": 0x2C05, "Є": 0x2C27, "Ж": 0x2C06, "З": 0x2C08,
              "И": 0x2C0B, "І": 0x2C09, "Ї": 0x2C0A, "Й": 0x2C24, "К": 0x2C0D,
              "Л": 0x2C0E, "М": 0x2C0F, "Н": 0x2C10, "О": 0x2C11, "П": 0x2C12,
              "Р": 0x2C13, "С": 0x2C14, "Т": 0x2C15, "У": 0x2C16, "Ф": 0x2C17,
              "Х": 0x2C18, "Ц": 0x2C1C, "Ч": 0x2C1D, "Ш": 0x2C1E, "Щ": 0x2C1B,
              "Ь": 0x2C1F, "Ю": 0x2C23, "Я": 0x2C21,
          }
          legend = " ".join(f"{letter}={chr(cp)}" for letter, cp in legend_pairs.items())
          description = "🌍 Дайджест світових новин глаголицею (Galabir).\n" + legend

          resp = requests.post(f"{base}/setChatDescription", data={
              "chat_id": chat_id,
              "description": description,
          }, timeout=20)
          print("setChatDescription:", resp.status_code, resp.text)

          # 3. Set channel avatar
          with open("channel_avatar.png", "rb") as photo:
              resp = requests.post(f"{base}/setChatPhoto", data={
                  "chat_id": chat_id,
              }, files={"photo": photo}, timeout=30)
          print("setChatPhoto:", resp.status_code, resp.text)
          EOF2
